name: Compile on push

on: [push]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository code
              uses: actions/checkout@v4

            - name: Install and cache ARM GCC Toolchain
              uses: carlosperate/arm-none-eabi-gcc-action@v1

            - name: Compile
              run: |
                  make clean && make
